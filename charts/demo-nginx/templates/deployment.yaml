apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # меняется конфиг -> меняется хеш -> поды пересоздаются
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      containers:
        - name: nginx
          # Полное имя образа: адрес реестра зашит прямо сюда.
          # Именно эту строку читает kubelet, когда качает образ.
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.config }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          {{- end }}
